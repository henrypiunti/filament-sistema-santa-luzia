name: santa-luzia

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: santa-luzia:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/app/storage

services:
  app:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--memory=192"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  storage:
  caddy_data:
  caddy_config:
